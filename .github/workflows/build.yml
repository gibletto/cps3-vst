name: Windows build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      artifact:
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/sf3bridge/go.mod
          cache: false

      - name: Install formatter
        run: python -m pip install clang-format==19.1.5

      - name: Check formatting
        run: ./scripts/format.ps1 -Check

      - name: Read version
        id: version
        run: |
          . ./scripts/common.ps1
          $version = Get-ProjectVersion -Root $PWD.Path
          "version=$version" >> $env:GITHUB_OUTPUT
          $revision = & git rev-parse --short=7 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read checked-out commit' }
          "artifact=CPS3Instrument-$version-Windows-x64-$revision" >> $env:GITHUB_OUTPUT

      - name: Build, test and package
        run: ./scripts/build.ps1 -Jobs 2

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            dist/CPS3Instrument-${{ steps.version.outputs.version }}-Windows-x64.zip
            dist/CPS3Instrument-${{ steps.version.outputs.version }}-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
