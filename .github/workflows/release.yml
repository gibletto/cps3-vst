name: Windows release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.1.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      ready: ${{ steps.release.outputs.ready }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '\Av?[0-9]+\.[0-9]+(\.[0-9]+)?\z') {
              throw 'Use a version tag such as v0.1.1'
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Check release assets and version
        id: release
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          . ./scripts/common.ps1
          $version = Get-ProjectVersion -Root $PWD.Path
          $archive = "CPS3Instrument-$version-Windows-x64.zip"
          $ready = 'false'
          $existing = & gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
              $names = @(($existing | ConvertFrom-Json).assets.name)
              if ($archive -in $names -and "$archive.sha256" -in $names) {
                  $ready = 'true'
              }
          }
          if ($ready -ne 'true' -and $env:RELEASE_TAG -ne "v$version") {
              throw "Release tag must match VERSION: v$version"
          }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "ready=$ready" >> $env:GITHUB_OUTPUT

  build:
    needs: prepare
    if: needs.prepare.outputs.ready != 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: refs/tags/${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, build]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release-assets

      - name: Attach Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: ./scripts/release.ps1 -Tag $env:RELEASE_TAG -Version $env:RELEASE_VERSION -AssetsDirectory release-assets
